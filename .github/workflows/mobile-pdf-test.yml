name: Mobile and PDF geometry tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser and PDF test dependencies
        run: |
          npm install --no-save --no-package-lock playwright pdf-lib jpeg-js
          npx playwright install --with-deps chromium
      - name: Check mobile viewports and generated PDF geometry
        run: node scripts/mobile-pdf-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-validation-samples
          path: test-artifacts/*.pdf
          if-no-files-found: ignore
          retention-days: 7
